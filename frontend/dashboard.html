<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minha Biblioteca — Dashboard</title>
  <meta name="description" content="Gerencie seus livros na Biblioteca Pessoal." />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar" role="navigation" aria-label="Menu principal">
  <div class="navbar-inner">
    <a href="dashboard.html" class="navbar-brand" id="navbar-brand">
      <span class="brand-icon">📚</span>
      Biblioteca <span class="accent">Pessoal</span>
    </a>
    <div class="navbar-actions">
      <span class="navbar-user" id="navbar-username"></span>
      <button class="btn btn-primary btn-sm" id="new-book-btn">+ Novo Livro</button>
      <button class="btn btn-ghost btn-sm" id="logout-btn">Sair</button>
    </div>
  </div>
</nav>

<!-- MAIN -->
<main class="container" style="padding-top:2rem; padding-bottom:4rem;">

  <!-- STATS -->
  <section aria-label="Estatísticas">
    <div class="stats-grid" id="stats-grid">
      <div class="stat-card"><div class="stat-number" id="stat-total">—</div><div class="stat-label">Total de livros</div></div>
      <div class="stat-card"><div class="stat-number" id="stat-reading" style="color:var(--status-reading)">—</div><div class="stat-label">Lendo</div></div>
      <div class="stat-card"><div class="stat-number" id="stat-read" style="color:var(--status-read)">—</div><div class="stat-label">Lidos</div></div>
      <div class="stat-card"><div class="stat-number" id="stat-wishlist" style="color:var(--status-wishlist)">—</div><div class="stat-label">Lista de desejo</div></div>
      <div class="stat-card"><div class="stat-number" id="stat-avg" style="color:var(--accent-gold)">—</div><div class="stat-label">Avaliação média</div></div>
    </div>
  </section>

  <!-- TOOLBAR -->
  <div class="section-header">
    <h2>Meus Livros</h2>
  </div>

  <div class="toolbar">
    <div class="search-input-wrapper">
      <span class="search-icon">🔍</span>
      <input
        id="search-input"
        type="search"
        class="form-input search-input"
        placeholder="Buscar por título ou autor..."
        aria-label="Buscar livros"
      />
    </div>
    <select id="filter-status" class="form-input" style="max-width:180px;" aria-label="Filtrar por status">
      <option value="">Todos os status</option>
      <option value="WISHLIST">Lista de desejo</option>
      <option value="READING">Lendo</option>
      <option value="READ">Lidos</option>
    </select>
  </div>

  <!-- BOOKS GRID -->
  <section aria-label="Lista de livros" id="books-section">
    <div class="books-grid" id="books-grid" role="list">
      <!-- Livros renderizados pelo JS -->
    </div>
    <div class="empty-state" id="empty-state" style="display:none;">
      <span class="empty-icon">📖</span>
      <h3>Nenhum livro encontrado</h3>
      <p>Adicione seu primeiro livro clicando em "Novo Livro"</p>
    </div>
  </section>
</main>

<!-- MODAL: Formulário de livro -->
<div class="modal-overlay" id="book-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title">Novo Livro</h2>
      <button class="btn btn-ghost btn-icon" id="modal-close-btn" aria-label="Fechar">✕</button>
    </div>

    <form id="book-form" novalidate>
      <input type="hidden" id="book-id" />

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
        <div class="form-group" style="grid-column:1/-1;">
          <label class="form-label" for="book-title">Título *</label>
          <input id="book-title" type="text" class="form-input" placeholder="Nome do livro" required />
          <span class="field-error" id="book-title-error"></span>
        </div>
        <div class="form-group" style="grid-column:1/-1;">
          <label class="form-label" for="book-author">Autor *</label>
          <input id="book-author" type="text" class="form-input" placeholder="Nome do autor" required />
          <span class="field-error" id="book-author-error"></span>
        </div>
        <div class="form-group">
          <label class="form-label" for="book-isbn">ISBN</label>
          <input id="book-isbn" type="text" class="form-input" placeholder="978-..." />
        </div>
        <div class="form-group">
          <label class="form-label" for="book-genre">Gênero</label>
          <input id="book-genre" type="text" class="form-input" placeholder="Ficção, Romance..." />
        </div>
        <div class="form-group">
          <label class="form-label" for="book-status">Status</label>
          <select id="book-status" class="form-input">
            <option value="WISHLIST">Lista de desejo</option>
            <option value="READING">Lendo</option>
            <option value="READ">Lido</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="book-rating">Avaliação</label>
          <select id="book-rating" class="form-input">
            <option value="">Sem avaliação</option>
            <option value="1">⭐ 1 estrela</option>
            <option value="2">⭐⭐ 2 estrelas</option>
            <option value="3">⭐⭐⭐ 3 estrelas</option>
            <option value="4">⭐⭐⭐⭐ 4 estrelas</option>
            <option value="5">⭐⭐⭐⭐⭐ 5 estrelas</option>
          </select>
        </div>
        <div class="form-group" style="grid-column:1/-1;">
          <label class="form-label" for="book-cover">URL da capa</label>
          <input id="book-cover" type="url" class="form-input" placeholder="https://..." />
        </div>
        <div class="form-group" style="grid-column:1/-1;">
          <label class="form-label" for="book-notes">Notas pessoais</label>
          <textarea id="book-notes" class="form-input" placeholder="Suas anotações sobre o livro..."></textarea>
        </div>
      </div>

      <div style="display:flex; gap:0.75rem; justify-content:flex-end; margin-top:0.5rem;">
        <button type="button" class="btn btn-secondary" id="modal-cancel-btn">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="book-save-btn">Salvar</button>
      </div>
    </form>
  </div>
</div>

<!-- MODAL: Detalhes do livro -->
<div class="modal-overlay" id="detail-modal" role="dialog" aria-modal="true" aria-labelledby="detail-title">
  <div class="modal" style="max-width:600px;">
    <div class="modal-header">
      <h2 id="detail-title">Detalhes do Livro</h2>
      <button class="btn btn-ghost btn-icon" id="detail-close-btn" aria-label="Fechar">✕</button>
    </div>
    <div id="detail-content"></div>
    <div style="display:flex; gap:0.75rem; justify-content:flex-end; margin-top:1.5rem;">
      <button class="btn btn-danger btn-sm" id="detail-delete-btn">🗑️ Excluir</button>
      <button class="btn btn-secondary btn-sm" id="detail-edit-btn">✏️ Editar</button>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
